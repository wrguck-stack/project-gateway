# Use the Netlify Free workspace plan. This file does not select or upgrade a plan.
# Deploy feat/homepage-professional-pass with the CLI; GitHub CD is not connected.
[build]
  command = "NETLIFY=false GATEWAY_STORAGE=local npm test && npm run build && npm run typecheck"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24.19.0"
  NPM_FLAGS = "--include=dev"
  APP_MODE = "demo"
  NEXT_TELEMETRY_DISABLED = "1"

[context.production.environment]
  # Netlify CLI 27.10.2 builds its default prime URL from the raw Git branch.
  # A slash in feat/homepage-professional-pass becomes a URL path and points
  # the Next adapter's onSuccess warm-up at the wrong host. Production has
  # this verified, owned canonical URL; do not use a branch-derived URL here.
  DEPLOY_PRIME_URL = "https://project-gateway-wrguck.netlify.app"

# Netlify automatically installs its maintained Next.js adapter. Do not add a
# paid database, custom Functions region, larger compute tier, or paid add-on.
# The Next build records the non-secret CONTEXT/BRANCH values for isolated Blobs
# namespaces. Runtime credentials are injected by Netlify, never by this file.
