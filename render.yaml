# Prepared demo preview only. Importing this Blueprint creates a paid public service.
# No existing .gateway data is copied. See docs/deployment/render-preview.md.
services:
  - type: web
    name: project-gateway-demo
    runtime: node
    repo: https://github.com/wrguck-stack/project-gateway
    branch: feat/homepage-professional-pass
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev && npm test && npm run build && npm run typecheck
    startCommand: npm run start -- --port $PORT
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "24.19.0"
      - key: NODE_ENV
        value: production
      - key: APP_MODE
        value: demo
      - key: GATEWAY_DATA_DIR
        value: /var/data/gateway
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
    disk:
      name: gateway-demo-data
      mountPath: /var/data/gateway
      sizeGB: 1
